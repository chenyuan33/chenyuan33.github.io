<!DOCTYPE html>
<html>

<head>
	<script src="/helper.js"></script>
	<title data-i18n="tool.visualizationOfSortingAlgo.title"></title>
	<style>
		#visu-box {
			height: 100px;
			background-color: black;
			border: solid;
		}

		.element-of-visu {
			display: inline-block;
		}
	</style>
	<script src="/tool/visualization-of-sorting-algo/main.js"></script>
</head>

<body>
	<div class="card">
		<h1 data-i18n="tool.visualizationOfSortingAlgo.title"></h1>
		<p data-i18n="tool.visualizationOfSortingAlgo.refer"></p>
		<div id="visu-box"></div>
	</div>
	<div class="card">
		<h2 data-i18n="tool.visualizationOfSortingAlgo.recreate.title"></h2>
		<label for="array-size" data-i18n="tool.visualizationOfSortingAlgo.recreate.arraySize"></label>
		<input type="number" id="array-size" value="20" min="1" oninput="checkArraySize()">
		<br>
		<input type="checkbox" id="many-duplicated">
		<label for="many-duplicated" data-i18n="tool.visualizationOfSortingAlgo.recreate.manyDuplicated"></label>
		<br>
		<button id="arrayRemaker1" onclick="makeRand()" data-i18n="tool.visualizationOfSortingAlgo.recreate.makeRand"></button>
		<button id="arrayRemaker2" onclick="makeInc()" data-i18n="tool.visualizationOfSortingAlgo.recreate.makeInc"></button>
		<button id="arrayRemaker3" onclick="makeDec()" data-i18n="tool.visualizationOfSortingAlgo.recreate.makeDec"></button>
		<script>
			makeRand();
		</script>
	</div>
	<div class="card">
	<h2 data-i18n="tool.visualizationOfSortingAlgo.settings.title"></h2>
	<label for="delay" data-i18n="tool.visualizationOfSortingAlgo.settings.delay"></label>
	<input type="number" id="delay" value="0" min="0">
	<br>
	<button id="pause" onclick="pause()" data-i18n="tool.visualizationOfSortingAlgo.settings.pause"></button>
	<button onclick="stop()" data-i18n="tool.visualizationOfSortingAlgo.settings.stop"></button>
	</div>
	<div class="card">
	<h2 data-i18n="tool.visualizationOfSortingAlgo.sorting.title"></h2>
	<p id="sortingButtons"></p>
	<label for="mergeSortWayCount" data-i18n="tool.visualizationOfSortingAlgo.sorting.mergeSortWayCount"></label>
	<input type="number" id="mergeSortWayCount" value="2" min="2" oninput="updateMergeSortName()">
	</div>
</body>

</html>
